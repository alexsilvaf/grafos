<section class="cadastro">
  <h2>Cadastro de Nó</h2>

  <form (ngSubmit)="salvar()" #f="ngForm">
    <div class="form-group">
      <label for="id">Identificador do nó</label>
      <input
        id="id"
        name="id"
        type="text"
        [(ngModel)]="id"
        [disabled]="enviando"
        required>
    </div>

    <div class="acoes">
      <button type="submit" class="btn-primary" [disabled]="enviando">
        {{ enviando ? 'Salvando...' : 'Cadastrar' }}
      </button>
      <button type="button" class="btn-secondary" (click)="voltar()">
        Voltar
      </button>
    </div>
  </form>

  <div *ngIf="mensagem" class="mensagem sucesso">{{ mensagem }}</div>
  <div *ngIf="erro" class="mensagem erro">{{ erro }}</div>
</section>
